name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]  # vX.Y.Z : publie aussi une Release (mise a jour depuis l'application)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # creation des Releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30  # un dialogue bloqué ne doit pas occuper le runner 6 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup (si absent de l'image)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (tests + exe + autotest + installeur)
        run: .\packaging\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PDFManager-setup
          path: dist/PDFManager-*-setup.exe
          if-no-files-found: error

      - name: Publier la Release (tag vX.Y.Z, notes tirees du CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $notes = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          Set-Content notes.md $notes -Encoding utf8
          # echoue si le tag ne correspond pas a __version__ (installeur introuvable)
          gh release create $env:GITHUB_REF_NAME "dist\PDFManager-$v-setup.exe" --title "PDFManager $v" --notes-file notes.md

      - name: Journal de l'application (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdfmanager-log
          path: ${{ env.APPDATA }}/PDFManager/pdfmanager.log
          if-no-files-found: ignore
